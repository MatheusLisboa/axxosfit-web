    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://axxosfit.com.br/#website",
            "url": "https://axxosfit.com.br/",
            "name": "AxxosFit",
            "description": "Plataforma SaaS para personal trainers gerenciarem alunos, treinos e evolução.",
            "inLanguage": "pt-BR"
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://axxosfit.com.br/#software",
            "name": "AxxosFit",
            "url": "https://axxosfit.com.br/",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "description": "Gerencie alunos, crie treinos personalizados e acompanhe resultados. App do aluno incluso — apenas o personal assina.",
            "offers": [
              {
                "@type": "Offer",
                "name": "Starter",
                "price": "29.90",
                "priceCurrency": "BRL",
                "description": "Até 5 alunos ativos. 7 dias grátis, sem cartão."
              },
              {
                "@type": "Offer",
                "name": "Pro",
                "price": "49.90",
                "priceCurrency": "BRL",
                "description": "Até 10 alunos ativos, avaliação física completa, PDF profissional e controle financeiro."
              },
              {
                "@type": "Offer",
                "name": "Studio",
                "price": "99.90",
                "priceCurrency": "BRL",
                "description": "100 alunos inclusos (R$ 1,99 por aluno extra), IA Coach, relatórios avançados e suporte por WhatsApp."
              }
            ],
            "provider": {
              "@type": "Organization",
              "name": "AxxosFit",
              "url": "https://axxosfit.com.br/",
              "email": "contato@axxosfit.com.br",
              "contactPoint": {
                "@type": "ContactPoint",
                "email": "contato@axxosfit.com.br",
                "contactType": "customer support"
              }
            }
          },
          {
            "@type": "FAQPage",
            "@id": "https://axxosfit.com.br/#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "O AxxosFit necessita de instalação local?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Não. O AxxosFit é um SaaS 100% web e na nuvem. Você e seus alunos acessam por qualquer telefone, tablet ou computador — e ainda podem instalar o app na tela inicial do celular."
                }
              },
              {
                "@type": "Question",
                "name": "Meus alunos pagam para acessar?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Não. O app do aluno é gratuito. O personal cadastra e convida o aluno (por WhatsApp ou e-mail) e apenas o personal assina um plano."
                }
              },
              {
                "@type": "Question",
                "name": "Como funciona o trial de 7 dias?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Todo personal começa no Starter com 7 dias grátis, sem precisar de cartão. Você testa o editor de treinos, o app do aluno e a evolução básica. Terminado o período, o cadastro de alunos, treinos e avaliações fica bloqueado até você assinar um plano."
                }
              },
              {
                "@type": "Question",
                "name": "Qual a diferença entre Starter, Pro e Studio?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "O Starter (R$ 29,90/mês) atende até 5 alunos ativos. O Pro (R$ 49,90/mês) sobe para 10 alunos e libera avaliação física completa, PDF profissional, controle financeiro, anamnese avançada e suporte prioritário. O Studio (R$ 99,90/mês) inclui até 100 alunos, IA Coach, relatórios avançados e suporte prioritário por WhatsApp."
                }
              },
              {
                "@type": "Question",
                "name": "O que acontece se eu passar do limite de alunos?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No Starter e no Pro você faz upgrade para cadastrar mais alunos. No Studio o cadastro não é bloqueado acima de 100: cada aluno extra soma R$ 1,99/mês à sua fatura."
                }
              },
              {
                "@type": "Question",
                "name": "O que é o IA Coach?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "É um assistente que gera a ficha de treino do aluno (ABC, full body, superior/inferior ou PPL) a partir da sua biblioteca de exercícios. Você revisa e publica direto no app do aluno. Disponível no plano Studio."
                }
              }
            ]
          }
        ]
      }
    </script>
